# Nginx：反向代理 + 负载均衡 + request_id 的源头
#
# 只有网关能做的四件事：
#   1. 生成 request_id 并传下去 —— 同一个 id 同时出现在 nginx 和应用日志里，
#      排查时不用靠时间戳猜「这条应用日志对应哪个请求」
#   2. 关掉响应缓冲 —— 不关的话 SSE 会被 nginx 攒成一整块再转发，
#      前端看到的「流式」变成「等 30 秒然后一次性弹出全文」
#   3. 限制请求体大小 —— 在进入 Python 之前就挡掉超大上传，省一次磁盘写入
#   4. 多副本负载均衡 + 故障摘除

# 记的是 $rid（map 后的最终值），不是 $request_id。
#   这两个值在客户端带了 X-Request-ID 时**不一致**：$request_id 永远是 nginx 生成的，
#   记它会导致 nginx 日志里的 id 和应用日志里的 id 对不上——那这条链路就白做了。
#   （这个坑已经踩过一次：第一版写的就是 $request_id。）
log_format with_rid '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    'rid=$rid rt=$request_time urt=$upstream_response_time';

# 优先用客户端传上来的 X-Request-ID，没有才自己生成。
#   为什么不无脑用 $request_id 覆盖：前端/移动端排障时往往自带一个 id
#   （用户截图里的单号），覆盖掉就永远对不上。
#   对应的风险是「有人伪造别人的 id 污染日志」——应用层会把长度截到 64 并原样记录，
#   真要防这个得签名，当前阶段不值得。
#   map 必须放在 http 块里，conf.d/*.conf 正好被 include 在 http 内，所以能写在这儿。
map $http_x_request_id $rid {
    default $http_x_request_id;
    ""      $request_id;
}

# Docker 内置 DNS。127.0.0.11 是每个 compose 网络里的 DNS 服务器。
# valid=10s：解析结果缓存 10 秒就重查，容器重建换 IP 后最多 10 秒自动恢复。
#
# 为什么必须放在 http 层（文件顶层）而不是 server 里：
#   upstream 块里的 `resolve` 参数要用它，而 upstream 属于 http 上下文。
resolver 127.0.0.11 valid=10s ipv6=off;

# ── 后端服务组 ────────────────────────────────────────────
# 为什么用 upstream 而不是 `proxy_pass http://app:8000`：
#   ① 写死主机名时 nginx 只在**启动时**解析一次并永久缓存 IP。容器重建后
#      IP 变了还在往旧 IP 发请求 → 502（这个坑已经踩过）；
#   ② 变量形式的 proxy_pass（set $upstream_app ...）虽然能动态解析，
#      但**只取第一个 A 记录**——多副本时一半请求永远打不到，
#      负载均衡形同虚设。
#
# `server app:8000 resolve` 是 1.27.3+ 才支持的写法：
#   Docker DNS 返回 app 服务的**全部副本 IP**，nginx 按 round-robin 分发，
#   并且每个 valid 周期重新解析一次，副本扩缩容后自动跟上。
#   所以镜像 tag 必须 pin 在 1.27.5，用 1.27-alpine 拉到旧版本会启动失败。
#
# zone：共享内存区。没有它，多 worker 进程各自维护一份后端列表，
#   健康状态不互通（一个 worker 已摘除的节点，另一个还在往里发）。
upstream app_backend {
    zone app_backend 64k;
    server app:8000 resolve max_fails=2 fail_timeout=10s;
    # 到上游用长连接：SSE 每次都新建 TCP 会多一次握手 + TLS（如启用）
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log with_rid;

    # 应用侧限制 20MB。这里给到 25MB 是故意的：
    # 让 20~25MB 的文件进到应用、由应用返回 413 和中文提示；
    # 如果 nginx 先拦，用户只会看到一段英文的 413 页面
    client_max_body_size 25m;

    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 传给应用；应用侧 RequestContextMiddleware 会优先复用它
        proxy_set_header X-Request-ID $rid;

        # ---- SSE 专用（/chat/stream）----
        # 缓冲一开，token 会被攒在 nginx 的 buffer 里，
        # 表现为「流式接口不流」，而且前端完全看不出问题在哪
        proxy_buffering off;
        proxy_cache off;
        # 一次 Agent 推理可能几十秒，默认 60s 会把长回答切断。
        # 注意：应用侧闸门会把排队超时压到 3 秒并返回 503，
        # 所以这个 300s 只该被「真的在生成」的请求用到
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 让 upstream 长连接生效（不设的话 nginx 会带 Connection: close）
        proxy_set_header Connection "";

        # ── 故障转移到另一个副本 ──
        # 只重试**连接层失败**和 502/503：
        #   502/503 说明这个副本压根没接住请求（进程刚挂、就绪检查没过），
        #   换一个副本重发是安全的。
        # 刻意**不含 timeout**：读超时说明后端正在生成，重发会重复计费、
        #   而且用户会在前端看到两份回答。
        proxy_next_upstream error http_502 http_503;
        proxy_next_upstream_tries 2;
        # 已经发出部分请求体的不算可重试（POST /chat 带 body，避免重复提交）
        proxy_next_upstream_timeout 10s;
    }
}
