name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Check Python syntax
        run: |
          python -m py_compile app.py
          python -m py_compile agent/react_agent.py
          python -m py_compile agent/tools/middleware.py
          python -m py_compile fastapi_app/main.py
          python -m py_compile rag/rag_service.py
          python -m py_compile rag/vector_store.py
          python -m py_compile model/factory.py
          python -m py_compile tests/eval_quick.py

      - name: Run tests
        env:
          # 单元测试只验证导入与配置结构，不发起真实模型调用，因此固定使用占位值。
          # 不引用 secrets 的原因：① 仓库未配置 secret 时值为空会导致客户端初始化失败；
          # ② secret 里粘贴的值可能带不可见字符（空格/制表符），会把 CI 变成假失败；
          # ③ fork 提交的 PR 拿不到 secrets。
          DASHSCOPE_API_KEY: 'sk-ci-placeholder'
          DASHSCOPE_BASE_URL: 'https://dashscope.aliyuncs.com/compatible-mode/v1'
        run: |
          # 用 `python -m pytest` 而非 `pytest`：前者会把当前目录加入 sys.path，
          # 保证 tests/ 下能 import 项目内的 utils/rag/agent 等模块。
          # 项目根的 conftest.py 已做兜底，两种方式都能跑，这里用更稳的一种。
          python -m pytest tests/ -v --tb=short
